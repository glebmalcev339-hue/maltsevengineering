# Maltsev Engineering — Nginx. Замените example.com на свой домен.
# Статика — напрямую, API/оплата/HTML — на Python (127.0.0.1:8080).
# HTTPS добавит certbot сам: certbot --nginx -d example.com -d www.example.com
upstream maltsev_shop {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name example.com www.example.com;

    # www -> apex (работает и после добавления HTTPS certbot'ом)
    if ($host = www.example.com) {
        return 301 https://example.com$request_uri;
    }

    root /home/shop/maltsev;
    index market.html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Приватное — никогда наружу, даже если спросят напрямую
    location ~ ^/(data|config\.json|ADMIN_ACCESS\.txt|.*\.py|.*\.bat|.*\.service) {
        deny all;
        return 404;
    }

    # Статика с кешем
    location ~* \.(png|jpg|jpeg|svg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location = /robots.txt { expires 1d; }
    location = /sitemap.xml { expires 1d; }
    location = /market.yml { expires 1h; }

    # API и оплата — только на бэкенд
    location /api/ {
        proxy_pass http://maltsev_shop;
        proxy_read_timeout 120s;  # поиск ПВЗ может занять до минуты
    }
    location /pay/ {
        proxy_pass http://maltsev_shop;
    }

    # HTML — через бэкенд (единый no-store, защита от старого кеша цен)
    location = / { proxy_pass http://maltsev_shop; }
    location = /market.html { proxy_pass http://maltsev_shop; }
    location = /admin.html {
        proxy_pass http://maltsev_shop;
        # при желании ограничьте вход в админку своим IP:
        # allow 1.2.3.4; deny all;
    }
}
